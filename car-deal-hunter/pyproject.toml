[project]
name = "car-deal-hunter"
version = "0.1.0"
description = "Used-car price estimator and deal hunter (Weeks 6–8, no paid APIs)"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.1.0",
    "datasets>=3.0.0",
    "gradio>=5.0.0,<6.0",
    "joblib>=1.4.0",
    "numpy>=2.0.0",
    "ollama>=0.6.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "scikit-learn>=1.5.0",
    "sentence-transformers>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["car_hunter"]
